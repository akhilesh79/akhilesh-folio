name: Link Check

on:
  # Run after Vercel (or any) deployment completes
  deployment_status:

  # Also run on pushes/PRs to main
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'deployment_status'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  link-check:
    runs-on: ubuntu-latest
    # Only run when deployment succeeded, or on push/PR events
    if: >
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'

    steps:
      - name: Determine site URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "deployment_status" ]; then
            echo "site_url=${{ github.event.deployment_status.target_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://akhilesh-folio.vercel.app" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for site to be reachable
        run: |
          for i in $(seq 1 10); do
            if curl -sSf "${{ steps.url.outputs.site_url }}" > /dev/null 2>&1; then
              echo "Site is up!"
              exit 0
            fi
            echo "Attempt $i — waiting 10s..."
            sleep 10
          done
          echo "Site not reachable after 100s"
          exit 1

      - name: Check all links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,204,301,302,403,429
            --exclude 'tel:'
            --exclude 'mailto:'
            --timeout 30
            --max-retries 3
            "${{ steps.url.outputs.site_url }}"
          fail: true
